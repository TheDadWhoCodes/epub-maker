<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-to-EPUB Converter</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.5rem; color: #111; }
    label { font-weight: 600; display: block; margin-top: 1rem; }
    textarea, input[type="text"], input[type="file"], button { width: 100%; padding: 0.75rem; margin-top: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #0066cc; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 1.5rem; }
    button:hover { background: #0052a3; }
    #status { margin-top: 1rem; padding: 1rem; display: none; border-radius: 6px; }
    .success { background: #e6fffa; color: #047857; }
    .error { background: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>📚 Web-to-EPUB Generator</h1>
  <form id="epub-form">
    <label for="book-title">eBook Title (Optional):</label>
    <input type="text" id="book-title" placeholder="Leave blank to let Gemini auto-generate">

    <label for="article-urls">Article URLs (One per line):</label>
    <textarea id="article-urls" rows="5" placeholder="https://example.com/article-1&#10;https://example.com/article-2" required></textarea>

    <label for="cover-image">Book Cover Image:</label>
    <input type="file" id="cover-image" accept="image/*">

    <label for="pat-token">GitHub Personal Access Token (PAT):</label>
    <input type="password" id="pat-token" placeholder="ghp_xxxxxxxxxxxx" required>

    <button type="submit" id="submit-btn">🚀 Generate & Compile EPUB</button>
  </form>

  <div id="status"></div>

  <script>
    document.getElementById('epub-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');
      
      const title = document.getElementById('book-title').value;
      const urls = document.getElementById('article-urls').value.split('\n').filter(u => u.trim() !== '');
      const token = document.getElementById('pat-token').value;
      const coverFile = document.getElementById('cover-image').files[0];

      submitBtn.disabled = true;
      submitBtn.innerText = "Encoding & Sending...";

      let coverBase64 = null;
      if (coverFile) {
        coverBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(coverFile);
        });
      }

      // Payload sent to GitHub Actions trigger
      const payload = {
        event_type: "generate_epub",
        client_payload: {
          title: title,
          urls: urls,
          cover_base64: coverBase64
        }
      };

      try {
        // REPLACE WITH YOUR GITHUB USERNAME AND REPO NAME
        const response = await fetch('https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO/dispatches', {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusDiv.className = 'status success';
          statusDiv.style.display = 'block';
          statusDiv.innerText = '✅ Build triggered! GitHub Actions is processing your EPUB now.';
        } else {
          throw new Error(`GitHub API error: ${response.statusText}`);
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.style.display = 'block';
        statusDiv.innerText = `❌ Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 Generate & Compile EPUB";
      }
    });
  </script>
</body>
</html>
